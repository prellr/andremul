[package]
name = "andremul"
version = "1.1.1"
edition = "2021"
description = "Andremul — run Android apps on your desktop (cross-platform)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
zip = "2"
flate2 = "1"
tar = "0.4"

[[bin]]
name = "andremul"
path = "src/main.rs"
